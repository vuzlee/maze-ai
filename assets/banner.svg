<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="MazeAI — foundations for data, ML and AI engineers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FE"/>
      <stop offset=".4" stop-color="#E4E7F8"/>
      <stop offset="1" stop-color="#C9CFF0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".96" cy=".04" r=".5">
      <stop offset="0" stop-color="#6572B4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6572B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#40456A"/>
      <stop offset="1" stop-color="#8593D8"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#6572B4" fill-opacity=".3"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#glow)"/>
  <rect x="820" y="0" width="380" height="180" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#8593D8" stroke-opacity=".75"/>
  <g transform="translate(58 66) scale(4.6)">
    <!-- same artwork as assets/favicon.svg: the soft M, no tile -->
    <path d="M5 26 V10 Q5 7 8 7 Q11 7 11 10 V15 Q11 18 13.5 18 Q16 18 16 15 V14 Q16 11 18.5 11 Q21 11 21 9 Q21 7 24 7 Q27 7 27 10 V26" fill="none" stroke="url(#logo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 22 L18.5 24.5 L16 27 L13.5 24.5 Z" fill="url(#logo)"/>
  </g>
  <text x="222" y="150" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="78" fill="#2C2C3E">Maze<tspan fill="#6572B4" font-style="italic">AI</tspan></text>
  <text x="226" y="196" font-family="'Be Vietnam Pro', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#40456A">Foundations for data, ML and AI engineers — from the problem to the mechanism.</text>
  <text x="226" y="240" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#565B80">DSA · PYTHON · SQL · SYSTEMS · ML · DEEP LEARNING · TRANSFORMER · LLM · MLOPS</text>
