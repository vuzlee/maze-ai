<svg viewBox="0 0 860 478" role="img" aria-label="Tám bước two pointers phủ hết 36 cặp, và bốn quy tắc chọn đầu để bỏ đo trên 20.000 mảng ngẫu nhiên">
<text class="sv-hv" x="0" y="18">h = [1,8,6,2,5,4,8,3,7] · 36 CẶP, 8 BƯỚC</text>
<text class="sv-s" x="0" y="44" fill="var(--faint)">cặp đang xét</text>
<text class="sv-s" x="150" y="44" fill="var(--faint)">diện tích</text>
<text class="sv-s" x="224" y="44" fill="var(--faint)">bỏ đầu</text>
<text class="sv-s" x="340" y="44" fill="var(--faint)" text-anchor="end">loại được</text>
<line x1="0" y1="52" x2="340" y2="52" stroke="var(--rule)" stroke-width="1"/>
<text class="sv-l" x="0" y="74" fill="var(--text)">1 … 7</text>
<text class="sv-l" x="196" y="74" fill="var(--text)" text-anchor="end">8</text>
<text class="sv-d" x="224" y="74" fill="var(--faint)">trái</text>
<text class="sv-d" x="340" y="74" fill="var(--ok)" text-anchor="end">8 cặp</text>
<rect x="0" y="84" width="348" height="24" rx="4" fill="rgba(var(--amber-a),.12)" stroke="var(--rule-hi)" stroke-width="0"/>
<text class="sv-l" x="0" y="100" fill="var(--probe)">8 … 7</text>
<text class="sv-l" x="196" y="100" fill="var(--probe)" text-anchor="end">49</text>
<text class="sv-d" x="224" y="100" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="100" fill="var(--ok)" text-anchor="end">7 cặp</text>
<text class="sv-l" x="0" y="126" fill="var(--text)">8 … 3</text>
<text class="sv-l" x="196" y="126" fill="var(--text)" text-anchor="end">18</text>
<text class="sv-d" x="224" y="126" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="126" fill="var(--ok)" text-anchor="end">6 cặp</text>
<text class="sv-l" x="0" y="152" fill="var(--text)">8 … 8</text>
<text class="sv-l" x="196" y="152" fill="var(--text)" text-anchor="end">40</text>
<text class="sv-d" x="224" y="152" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="152" fill="var(--ok)" text-anchor="end">5 cặp</text>
<text class="sv-l" x="0" y="178" fill="var(--text)">8 … 4</text>
<text class="sv-l" x="196" y="178" fill="var(--text)" text-anchor="end">16</text>
<text class="sv-d" x="224" y="178" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="178" fill="var(--ok)" text-anchor="end">4 cặp</text>
<text class="sv-l" x="0" y="204" fill="var(--text)">8 … 5</text>
<text class="sv-l" x="196" y="204" fill="var(--text)" text-anchor="end">15</text>
<text class="sv-d" x="224" y="204" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="204" fill="var(--ok)" text-anchor="end">3 cặp</text>
<text class="sv-l" x="0" y="230" fill="var(--text)">8 … 2</text>
<text class="sv-l" x="196" y="230" fill="var(--text)" text-anchor="end">4</text>
<text class="sv-d" x="224" y="230" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="230" fill="var(--ok)" text-anchor="end">2 cặp</text>
<text class="sv-l" x="0" y="256" fill="var(--text)">8 … 6</text>
<text class="sv-l" x="196" y="256" fill="var(--text)" text-anchor="end">6</text>
<text class="sv-d" x="224" y="256" fill="var(--faint)">phải</text>
<text class="sv-d" x="340" y="256" fill="var(--ok)" text-anchor="end">1 cặp</text>
<line x1="0" y1="268" x2="340" y2="268" stroke="var(--rule)" stroke-width="1"/>
<text class="sv-d" x="0" y="290" fill="var(--text)">8 bước</text>
<text class="sv-d" x="340" y="290" fill="var(--ok)" text-anchor="end">36 cặp</text>
<text class="sv-d" x="0" y="326" fill="var(--muted)">Cộng cột phải đúng bằng số cặp của cả mảng: 8 bước phủ hết 36</text>
<text class="sv-d" x="0" y="342" fill="var(--muted)">cặp, không sót cặp nào. Đó là chỗ O(n) nuốt được O(n²).</text>
<text class="sv-hv" x="372" y="18">BỎ ĐẦU NÀO? ĐO TRÊN 20.000 MẢNG DÀI 7</text>
<rect x="372" y="44" width="488" height="54" rx="5" fill="rgba(var(--green-a),.10)" stroke="var(--ok)" stroke-width="1"/>
<text class="sv-t" x="388" y="66" fill="var(--ok)">bỏ cạnh THẤP hơn</text>
<text class="sv-s" x="388" y="84" fill="var(--dim)">sai 0 lần · 0%</text>
<rect x="372" y="106" width="488" height="54" rx="5" fill="rgba(var(--green-a),.10)" stroke="var(--ok)" stroke-width="1"/>
<text class="sv-t" x="388" y="128" fill="var(--ok)">bỏ cạnh thấp, hoà thì bỏ trái</text>
<text class="sv-s" x="388" y="146" fill="var(--dim)">sai 0 lần · 0% — hoà bỏ đầu nào cũng được</text>
<rect x="372" y="168" width="488" height="54" rx="5" fill="rgba(var(--red-a),.10)" stroke="var(--tomb)" stroke-width="1"/>
<text class="sv-t" x="388" y="190" fill="var(--tomb)">bỏ cạnh CAO hơn</text>
<text class="sv-s" x="388" y="208" fill="var(--dim)">sai 12.801 lần · 64%</text>
<rect x="372" y="230" width="488" height="54" rx="5" fill="rgba(var(--red-a),.10)" stroke="var(--tomb)" stroke-width="1"/>
<text class="sv-t" x="388" y="252" fill="var(--tomb)">luôn bỏ đầu trái</text>
<text class="sv-s" x="388" y="270" fill="var(--dim)">sai 7.801 lần · 39%</text>
<text class="sv-t" x="372" y="312" fill="var(--text)">Ca nhỏ nhất làm "bỏ cạnh cao" gãy: h = [1, 3, 3]</text>
<rect x="372" y="332" width="150" height="32" rx="4" fill="rgba(var(--green-a),.08)" stroke="var(--ok)" stroke-width="1.2"/>
<text class="sv-d" x="384" y="353.0" fill="var(--ok)">đúng: 1 &amp; 3</text>
<text class="sv-d" x="536" y="353.0" fill="var(--muted)">min(1,3) × 2 = 3</text>
<rect x="372" y="372" width="150" height="32" rx="4" fill="rgba(var(--red-a),.08)" stroke="var(--tomb)" stroke-width="1.2"/>
<text class="sv-d" x="384" y="393.0" fill="var(--tomb)">bỏ cao trước: 3 &amp; 3</text>
<text class="sv-d" x="536" y="393.0" fill="var(--muted)">min(3,3) × 1 = 2</text>
<text class="sv-s" x="372" y="432" fill="var(--dim)">Diện tích bị chặn bởi cạnh THẤP. Giữ nó lại thì mọi cặp còn lại đều hẹp hơn</text>
<text class="sv-s" x="372" y="452" fill="var(--dim)">mà chiều cao không vượt nổi nó — nên bỏ nó đi mới là bỏ an toàn.</text>
</svg>