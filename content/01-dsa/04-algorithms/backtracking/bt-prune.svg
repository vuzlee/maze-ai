<text class="sv-s" x="388" y="148" fill="var(--dim)">tỉa · 2.057 nút · 0,002 giây</text>
<rect x="372" y="172" width="488" height="54" rx="5" fill="rgba(var(--green-a),.10)" stroke="var(--ok)" stroke-width="1"/>
<text class="sv-t" x="388" y="194" fill="var(--ok)">C · tỉa y hệt B, kiểm bằng quét lại quân đã đặt</text>
<text class="sv-s" x="388" y="212" fill="var(--dim)">tỉa · 2.057 nút · 0,005 giây — chậm hơn B 2,5 lần</text>
<text class="sv-t" x="372" y="256" fill="var(--text)">Đổi cách kiểm hay đổi CHỖ kiểm?</text>
<rect x="372" y="278" width="118" height="32" rx="4" fill="none" stroke="var(--rule-hi)" stroke-width="1.2"/>
<text class="sv-d" x="384" y="299.0" fill="var(--rule-hi)">B → C</text>
<text class="sv-d" x="504" y="299.0" fill="var(--muted)">đổi cách kiểm: chậm 2,5 lần</text>
<rect x="372" y="318" width="118" height="32" rx="4" fill="rgba(var(--amber-a),.08)" stroke="var(--probe)" stroke-width="1.2"/>
<text class="sv-d" x="384" y="339.0" fill="var(--probe)">B → A</text>
<text class="sv-d" x="504" y="339.0" fill="var(--muted)">đổi chỗ kiểm: chậm 9.321 lần</text>
<text class="sv-s" x="372" y="378" fill="var(--dim)">Cùng một khung sáu dòng, cùng một phép kiểm hợp lệ.</text>
<text class="sv-s" x="372" y="398" fill="var(--dim)">Khác duy nhất: A hỏi "hợp lệ chưa?" ở lá, B hỏi ở từng hàng.</text>
