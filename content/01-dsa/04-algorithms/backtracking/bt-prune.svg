<text class="sv-s" x="388" y="84" fill="var(--dim)">không tỉa · 19.173.961 nút · 7,75 giây</text>
<rect x="372" y="108" width="488" height="54" rx="5" fill="rgba(var(--green-a),.10)" stroke="var(--ok)" stroke-width="1"/>
