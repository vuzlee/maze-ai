<text class="sv-d" x="0" y="354" fill="var(--muted)">Hai cột giống hệt nhau tới hàng 1. Hàng 2 là chỗ tách: ô vàng</text>
<text class="sv-d" x="0" y="370" fill="var(--muted)">— 64 với 42. Chênh 22 nút ở đó nhân lên thành 19 triệu ở dưới</text>
<text class="sv-d" x="0" y="386" fill="var(--muted)">đáy.</text>
<text class="sv-hv" x="372" y="18">BA CÁCH VIẾT, CÙNG RA ĐỦ 92 LỜI GIẢI</text>
<rect x="372" y="44" width="488" height="54" rx="5" fill="rgba(var(--red-a),.10)" stroke="var(--tomb)" stroke-width="1"/>
